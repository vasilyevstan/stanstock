name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest --cov=stanstock --cov-report=term-missing

      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: uv run python manage.py check --settings=stanstock.settings.test

      - name: Run deployment checks
        env:
          DJANGO_SECRET_KEY: "ci-only-long-random-looking-secret-not-used-outside-checks"
          DJANGO_ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgresql://stanstock:stanstock@localhost:5432/stanstock"
        run: uv run python manage.py check --deploy --settings=stanstock.settings.prod

  postgresql:
    name: postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stanstock
          POSTGRES_USER: stanstock
          POSTGRES_PASSWORD: stanstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stanstock -d stanstock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run PostgreSQL planner concurrency regression
        env:
          DATABASE_URL: "******localhost:5432/stanstock"
          DJANGO_SECRET_KEY: "ci-only-postgresql-test-secret"
        run: >-
          uv run pytest -q
          tests/test_portfolio_planner.py::test_concurrent_confirmations_for_different_portfolios_do_not_deadlock
          tests/test_portfolio_planner.py::test_concurrent_deposit_and_confirmation_do_not_deadlock
          tests/test_portfolio_planner.py::test_deposit_does_not_block_on_snapshot_foreign_key_locks
          tests/test_portfolio_planner.py::test_confirmation_does_not_block_on_snapshot_foreign_key_locks
          --ds=stanstock.settings.dev

  container:
    name: container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          tags: stanstock:ci
