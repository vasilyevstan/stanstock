name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'core' && 120 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [core, price-product, price-study]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Install Chromium for synthetic browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          case "$TEST_SUITE" in
            core)
              selection=(--ignore-glob='tests/test_research_product_*.py'
                         --ignore-glob='tests/test_research_price_product*.py')
              ;;
            price-study)
              selection=(tests/test_research_product_study_evidence.py)
              ;;
            price-product)
              selection=()
              for path in tests/test_research_product_*.py tests/test_research_price_product*.py; do
                if [ "$path" != tests/test_research_product_study_evidence.py ]; then
                  selection+=("$path")
                fi
              done
              ;;
            *) exit 1 ;;
          esac
          if [ "$TEST_SUITE" != price-product ]; then
            uv run pytest --cov=stanstock --cov-report=term-missing --maxfail=1 "${selection[@]}"
            exit
          fi
          # Temporary complete-byte evidence for the observed frozen-output mismatch.
          uv run python - "${selection[@]}" <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import platform
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          import numpy
          import polars
          import pytest

          source_root = Path.cwd().resolve()
          captured = {}

          def capture(frame, event, arg):
              if event == "return" and frame.f_code.co_name == "test_checkpoint_frozen_native_issuance_replay":
                  payload = frame.f_locals.get("complete_bytes")
                  if frame.f_locals.get("withheld") is False and isinstance(payload, bytes):
                      captured["payload"] = payload

          class Capture:
              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_call(self, item):
                  previous = sys.getprofile()
                  selected = item.name == "test_checkpoint_frozen_native_issuance_replay[success]"
                  if selected:
                      sys.setprofile(capture)
                  try:
                      yield
                  finally:
                      if selected:
                          sys.setprofile(previous)

          result = pytest.main(
              ["--cov=stanstock", "--cov-report=term-missing", "--maxfail=1", *sys.argv[1:]],
              plugins=[Capture()],
          )
          if "payload" not in captured:
              assert result != 0, "The selected frozen-output test did not execute"
              print("FROZEN_V1_DIAGNOSTIC: checkpoint not reached before the test failure")
              raise SystemExit(result)
          import stanstock
          assert Path(stanstock.__file__).resolve().is_relative_to(source_root / "src")

          baseline_revision = "f8008c584c4847776c1489965a22c67e25d61fda"
          probe = r'''
          import os, socket, sys
          from pathlib import Path
          source, output = map(Path, sys.argv[1:])
          os.chdir(source)
          def no_network(*args, **kwargs):
              raise RuntimeError("synthetic_frozen_probe_network_forbidden")
          socket.socket.connect = no_network
          socket.create_connection = no_network
          socket.getaddrinfo = no_network
          import pytest
          from django.conf import settings
          assert settings.DATABASES["default"]["ENGINE"] == "django.db.backends.sqlite3"
          assert settings.DATABASES["default"]["NAME"] == ":memory:"
          captured = {}
          def capture(frame, event, arg):
              if event == "return" and frame.f_code.co_name == "test_checkpoint_frozen_native_issuance_replay":
                  payload = frame.f_locals.get("complete_bytes")
                  if isinstance(payload, bytes):
                      captured["payload"] = payload
          class Capture:
              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_call(self, item):
                  sys.setprofile(capture)
                  try:
                      yield
                  finally:
                      sys.setprofile(None)
          result = pytest.main(
              ["-q", "-p", "pytest_django.plugin", "-p", "no:cacheprovider", "--tb=short",
               "-c", str(source / "pyproject.toml"),
               "tests/test_research_product_pipeline.py::test_checkpoint_frozen_native_issuance_replay[success]"],
              plugins=[Capture()],
          )
          import stanstock
          assert Path(stanstock.__file__).resolve().is_relative_to(source / "src")
          output.write_bytes(captured["payload"])
          raise SystemExit(result)
          '''
          with tempfile.TemporaryDirectory(prefix="frozen-v1-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              folder = Path(temporary)
              source = folder / "base"
              source.mkdir()
              archive = subprocess.check_output(["git", "archive", baseline_revision])
              with tarfile.open(fileobj=io.BytesIO(archive)) as archive_file:
                  archive_file.extractall(source, filter="data")
              script = folder / "probe.py"
              script.write_text(probe)
              output = folder / "baseline.json"
              environment = {
                  key: os.environ[key]
                  for key in ("PATH", "HOME", "LANG", "TMPDIR")
                  if key in os.environ
              }
              environment.update(
                  PYTHONPATH=str(source / "src"),
                  PYTHONDONTWRITEBYTECODE="1",
                  PYTHONNOUSERSITE="1",
                  PYTEST_DISABLE_PLUGIN_AUTOLOAD="1",
                  DJANGO_SETTINGS_MODULE="stanstock.settings.test",
              )
              baseline = subprocess.run(
                  [sys.executable, "-B", str(script), str(source), str(output)],
                  env=environment,
                  capture_output=True,
                  text=True,
              )
              print(json.dumps({
                  "diagnostic": "frozen-v1-same-runner",
                  "baseline_revision": baseline_revision,
                  "suite_exit": int(result),
                  "baseline_test_exit": baseline.returncode,
                  "python": platform.python_version(),
                  "machine": platform.machine(),
                  "libc": platform.libc_ver(),
                  "numpy": numpy.__version__,
                  "polars": polars.__version__,
                  "runner_image": os.environ.get("ImageVersion"),
              }, sort_keys=True))
              if not output.is_file():
                  print(baseline.stdout.replace(str(folder), "<diagnostic>"))
                  print(baseline.stderr.replace(str(folder), "<diagnostic>"))
                  raise RuntimeError("Frozen-baseline capture failed")
              payloads = {"candidate": captured["payload"], "baseline": output.read_bytes()}
              for label, payload in payloads.items():
                  print(json.dumps({
                      "frozen_payload": label, "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }, sort_keys=True))
                  encoded = base64.b64encode(payload).decode("ascii")
                  for index, offset in enumerate(range(0, len(encoded), 3000)):
                      print(f"FROZEN_V1_PAYLOAD {label} {index:04d} {encoded[offset:offset + 3000]}")
              assert payloads["candidate"] == payloads["baseline"], "Frozen base/candidate bytes differ"
          raise SystemExit(result)
          PY

      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: uv run python manage.py check --settings=stanstock.settings.test

      - name: Run deployment checks
        env:
          DJANGO_SECRET_KEY: "ci-only-long-random-looking-secret-not-used-outside-checks"
          DJANGO_ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgresql://stanstock:stanstock@localhost:5432/stanstock"
        run: uv run python manage.py check --deploy --settings=stanstock.settings.prod

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks]
    if: always()
    steps:
      - name: Require every complete test partition
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  postgresql:
    name: postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stanstock
          POSTGRES_USER: stanstock
          POSTGRES_PASSWORD: stanstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stanstock -d stanstock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Prepare static manifest for native rendering regressions
        env:
          DJANGO_SECRET_KEY: "ci-only-postgresql-test-secret"
        run: uv run python manage.py collectstatic --noinput --verbosity 0 --settings=stanstock.settings.dev

      - name: Run PostgreSQL integrity regressions
        env:
          POSTGRES_USER: "stanstock"
          POSTGRES_PASSWORD: "stanstock"
          DJANGO_SECRET_KEY: "ci-only-postgresql-test-secret"
          STANSTOCK_RESEARCH_PRODUCT_ENABLED: "false"
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/stanstock"
          uv run pytest -q \
            tests/test_personal_watchlist.py::test_tracked_symbol_normalizes_and_database_enforces_owner_uniqueness \
            tests/test_personal_watchlist.py::test_concurrent_equivalent_adds_create_exactly_one_tracked_symbol \
            tests/test_personal_watchlist.py::test_add_does_not_swallow_unrelated_integrity_error \
            tests/test_portfolio_planner.py::test_concurrent_confirmations_for_different_portfolios_do_not_deadlock \
            tests/test_portfolio_planner.py::test_concurrent_deposit_and_confirmation_do_not_deadlock \
            tests/test_portfolio_planner.py::test_deposit_does_not_block_on_snapshot_foreign_key_locks \
            tests/test_portfolio_planner.py::test_confirmation_does_not_block_on_snapshot_foreign_key_locks \
            tests/test_portfolio_refresh_validation.py \
            tests/test_portfolio_tracking.py::test_snapshot_and_snapshot_positions_are_immutable \
            tests/test_medium_forecast_v2.py::test_postgresql_v2_writer_locks_complete_authority_through_prediction_create[append] \
            tests/test_medium_forecast_v2.py::test_postgresql_v2_writer_locks_complete_authority_through_prediction_create[create] \
            tests/test_medium_forecast_v2.py::test_postgresql_analyze_snapshot_holds_advisory_parent_locks_to_outer_commit \
            tests/test_research_product_schema.py \
            tests/test_research_product_parent_guards.py \
            tests/test_research_refresh_evidence.py::test_manifest_decimal_fields_round_trip \
            tests/test_research_product_pipeline.py::test_signed_zero_projection_issues_and_replays \
            tests/test_research_product_scheduled.py \
            tests/test_research_product_frequency_evidence.py \
            tests/test_research_product_jobs.py::test_postgresql_frequency_registration_has_one_winner_and_retry_reads_its_bytes \
            tests/test_research_product_reader_web.py::test_native_four_layer_live_job_reader_and_authenticated_pages \
            tests/test_research_product_reader_web.py::test_status_history_performance_and_my_list_keep_boundaries \
            tests/test_decision_support_database.py \
            tests/test_decision_support_eligibility_scheduled.py::test_completed_scheduled_recovery_precedes_disabled_provider_and_dirty_checkout \
            tests/test_decision_support_eligibility_scheduled.py::test_closed_scheduled_batch_recovers_membership_before_credentials_or_quota \
            tests/test_decision_support_reader_web.py::test_real_v2_buy_producer_immutable_reader_and_existing_authenticated_render \
            tests/test_decision_support_reader_web.py::test_real_zero_is_matched_measured_activity_not_missing_or_buy \
            tests/test_decision_support_eligibility_pipeline.py::test_genuine_near_zero_forecast_survives_decimal_db_roundtrip \
            tests/test_research_product_study_evidence.py::test_registered_study_reader_fails_closed_on_forged_metadata_row \
            tests/test_research_outcomes.py::test_outcome_validation_separates_decision_and_advisory_success \
            tests/test_research_outcomes.py::test_prediction_horizon_and_evidence_role_must_match \
            tests/test_research_outcomes.py::test_outcome_role_integrity_triggers_are_installed \
            tests/test_research_reporting.py::test_postgresql_numeric_nonfinite_rows_withhold_exact_group \
            tests/test_data_immutability.py::test_company_classification_is_immutable_at_model_and_database_layers \
            tests/test_data_immutability.py::test_fundamental_fact_evidence_is_immutable_at_model_and_database_layers \
            tests/test_data_immutability.py::test_source_observation_event_is_immutable_at_model_and_database_layers \
            tests/test_data_sec_ingestion.py::test_concurrent_conflicting_observations_at_one_instant_leave_exactly_one \
            tests/test_data_sec_ingestion.py::test_concurrent_identical_observations_are_idempotent \
            tests/test_data_sec_ingestion.py::test_an_unrelated_integrity_error_is_never_swallowed \
            tests/test_data_sec_ingestion.py::test_a_real_instant_collision_is_still_handled \
            tests/test_data_sec_ingestion.py::test_a_corrupt_event_fails_on_idempotent_collision_and_on_recovery \
            tests/test_immutability_migrations.py::test_postgresql_immutability_sql_escapes_psycopg_placeholders \
            tests/test_research_refresh_validation.py \
            tests/test_research_outcome_refresh_validation.py \
            tests/test_scheduled_refresh.py::test_postgresql_opposite_daily_completion_wins_before_scheduler_reservation \
            tests/test_scheduled_refresh.py::test_nonempty_portfolio_proof_survives_parent_retry_without_refetch \
            tests/test_scheduled_refresh.py::test_scheduled_refresh_outcome_tamper_retry_without_refetch \
            --ds=stanstock.settings.dev

  container:
    name: container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          tags: stanstock:ci
