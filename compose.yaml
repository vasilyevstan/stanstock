services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stanstock
      POSTGRES_USER: stanstock
      POSTGRES_PASSWORD: stanstock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stanstock -d stanstock"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: "stanstock.settings.dev"
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "stanstock-compose-development-only-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DATABASE_URL: "postgresql://stanstock:stanstock@db:5432/stanstock"
      STANSTOCK_DATA_DIR: "/app/var/data"
      STANSTOCK_BACKUP_DIR: "/app/var/backups"
      STANSTOCK_DEMO_MODE: "${STANSTOCK_DEMO_MODE:-true}"
      STANSTOCK_OWNER_USERNAME: "${STANSTOCK_OWNER_USERNAME:-admin}"
      STANSTOCK_OWNER_PASSWORD: "${STANSTOCK_OWNER_PASSWORD:-stanstock-dev}"
      STANSTOCK_OWNER_EMAIL: "${STANSTOCK_OWNER_EMAIL:-}"
      TWELVE_DATA_API_KEY: "${TWELVE_DATA_API_KEY:-}"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
    volumes:
      - stanstock_data:/app/var/data
      - stanstock_backups:/app/var/backups

volumes:
  postgres_data:
  stanstock_backups:
  stanstock_data:
