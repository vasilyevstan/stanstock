[project]
name = "stanstock"
version = "0.1.0"
description = "Transparent stock research, prediction tracking, and backtesting"
authors = [
    { name = "Stanislav Vassiljev", email = "75614529+vasilyevstan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "exchange-calendars>=4.9,<5",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "polars>=1.30,<2",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
    "whitenoise>=6.9,<7",
]

[project.scripts]
stanstock = "stanstock.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<2",
    "playwright>=1.52,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "stanstock.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"src/stanstock/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "stanstock.settings.test"
